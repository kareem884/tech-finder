name: Auto Update Products

on:
  schedule:
    - cron: '0 0 * * *' # يشتغل أوتوماتيك كل يوم الساعة 12 منتصف الليل
  workflow_dispatch: # يسمحلك تشغله يدوي بضغطة زر في أي وقت

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add products.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update products data" && git push)
